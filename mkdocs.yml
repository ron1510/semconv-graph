site_name: Semconv Graph
site_description: Turn existing OpenTelemetry traces into a live typed entity graph without changing app instrumentation.
site_url: https://ron1510.github.io/semconv-graph/
repo_url: https://github.com/ron1510/semconv-graph
repo_name: ron1510/semconv-graph
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Product Direction: product.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Local Demo: getting-started/quickstart.md
      - Auto-Instrumented Endpoint: getting-started/auto-instrumentation.md
      - Your First Custom Entity: getting-started/custom-entity.md
  - Concepts:
      - Semantic Entity Model: concepts/semantic-model.md
      - Python Package Architecture: concepts/package-architecture.md
      - Typed Gremlin Client: concepts/typed-gremlin-client.md
      - Graph Element Lifecycle: concepts/graph-element-lifecycle.md
      - Runtime Architecture: architecture.md
  - Configuration:
      - Registry Extensions: registry-extensions.md
      - Collector: configuration/collector.md
      - Flink Job: configuration/flink.md
      - Demo Traffic: configuration/demo.md
  - Deployment:
      - Kubernetes: deployment-and-operations.md
      - Local Kind Environment: deployment/local-kind.md
      - ArangoDB and Gremlin: deployment/arangodb-gremlin.md
  - Operations:
      - Monitoring: operations/monitoring.md
      - Upgrades and Recovery: operations/upgrades.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - Graph Element Event Schema: reference/event-schema.md
      - OTel Entity Conformance: reference/otel-entity-conformance.md
      - Helm Values: reference/helm-values.md
  - Community and Launch: community.md
  - Architecture Decisions:
      - Interaction-Derived ETL Topology: adr/0001-discover-etl-topology-from-interactions.md
  - Development:
      - Repository Development: development.md
      - Testing: development/testing.md
      - Benchmarking: development/benchmarking.md
      - Run PyFlink Locally: development/local-pyflink.md
