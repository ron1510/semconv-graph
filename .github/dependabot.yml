version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /packages/extended-opentelemetry-semconv
      - /services/otel-servicegraph-diff
      - /services/servicegraph-demo
      - /services/servicegraph-indexer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /services/otel-servicegraph-diff
      - /services/servicegraph-demo
      - /services/servicegraph-gremlin
      - /services/servicegraph-indexer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
