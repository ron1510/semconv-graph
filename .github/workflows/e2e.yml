name: Focused E2E

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-e2e
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  arangodb-gremlin:
    name: Kafka to typed Gremlin lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/extended-opentelemetry-semconv/pyproject.toml
            services/servicegraph-indexer/pyproject.toml

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Install Kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.31.0
          kubectl_version: v1.32.2
          install_only: true

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e ".[dev]" \
            -e "packages/extended-opentelemetry-semconv[gremlin]" \
            -e services/servicegraph-indexer

      - name: Run focused E2E
        run: python -m pytest tests/e2e -m e2e --run-e2e -v
