name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/extended-opentelemetry-semconv/pyproject.toml
            services/otel-servicegraph-diff/pyproject.toml
            services/servicegraph-demo/pyproject.toml
            services/servicegraph-indexer/pyproject.toml

      - name: Install validation environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            -e ".[dev,docs]" \
            -e "packages/extended-opentelemetry-semconv[gremlin]" \
            -e services/otel-servicegraph-diff \
            -e services/servicegraph-demo \
            -e services/servicegraph-indexer

      - name: Verify generated artifacts
        run: .venv/bin/python -m tools.semconv_codegen --check

      - name: Ruff
        run: .venv/bin/python -m ruff check .

      - name: Strict Pyright
        run: .venv/bin/python -m pyright

      - name: Unit and integration tests
        run: .venv/bin/python -m pytest -m "not e2e"

      - name: Strict documentation build
        run: .venv/bin/python -m mkdocs build --strict

  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Lint and render charts
        shell: bash
        run: |
          set -euo pipefail
          for chart in deploy/helm/*; do
            helm lint "$chart"
            helm template ci "$chart" >/dev/null
          done

  packages:
    name: Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/extended-opentelemetry-semconv/pyproject.toml
            services/otel-servicegraph-diff/pyproject.toml
            services/servicegraph-demo/pyproject.toml
            services/servicegraph-indexer/pyproject.toml

      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build check-wheel-contents twine
          for package in \
            packages/extended-opentelemetry-semconv \
            services/otel-servicegraph-diff \
            services/servicegraph-demo \
            services/servicegraph-indexer; do
            python -m build --sdist --wheel --outdir dist "$package"
          done

      - name: Inspect distribution metadata and wheel contents
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Install built wheels and check dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      - name: Upload inspected distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Container / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: extended-otel-flink-runtime
            context: .
            file: services/otel-servicegraph-diff/Dockerfile
          - image: extended-otel-servicegraph-demo
            context: .
            file: services/servicegraph-demo/Dockerfile
          - image: extended-otel-servicegraph-indexer
            context: .
            file: services/servicegraph-indexer/Dockerfile
          - image: extended-otel-servicegraph-gremlin
            context: services/servicegraph-gremlin
            file: services/servicegraph-gremlin/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
