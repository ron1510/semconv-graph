[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv"
version = "0.5.0"
license = "Apache-2.0"
description = "Typed OpenTelemetry-compatible semantic entities, relationships, and graph access."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["opentelemetry", "semantic-conventions", "service-graph", "gremlin", "pydantic"]
dependencies = [
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
gremlin = [
  "gremlinpython==3.8.1",
]

[project.urls]
Homepage = "https://github.com/ron1510/semconv-graph"
Documentation = "https://ron1510.github.io/semconv-graph/"
Repository = "https://github.com/ron1510/semconv-graph.git"
Issues = "https://github.com/ron1510/semconv-graph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extended_otel_semconv = ["metadata/*.json", "py.typed"]
