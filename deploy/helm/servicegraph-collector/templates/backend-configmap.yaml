{{- $dimensionModel := .Files.Get "files/dimensions.yaml" | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "servicegraph-collector.fullname" . }}-backend
  labels:
    {{- include "servicegraph-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: servicegraph-backend
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: localhost:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      cumulativetodelta/servicegraph:
        initial_value: auto
      filter/servicegraph_output:
        error_mode: ignore
        metric_conditions:
          - >-
            metric.name != "traces_service_graph_request_total" and
            metric.name != "traces_service_graph_request_failed_total"
          - datapoint.value_int == 0
      batch/traces:
        timeout: 1s
        send_batch_size: 256
      batch/servicegraph_metrics:
        timeout: 1s
        send_batch_size: {{ .Values.backend.serviceGraph.metricBatchSize }}
        send_batch_max_size: {{ .Values.backend.serviceGraph.metricBatchSize }}
    connectors:
      service_graph:
        dimensions:
          {{- range $dimensionModel.dimensions }}
          - {{ . }}
          {{- end }}
        virtual_node_peer_attributes: []
        database_name_attributes: [db.namespace, db.name]
        store:
          ttl: {{ .Values.backend.serviceGraph.storeTtl }}
          max_items: {{ .Values.backend.serviceGraph.storeMaxItems }}
        metrics_flush_interval: {{ .Values.backend.serviceGraph.metricsFlushInterval }}
    exporters:
      kafka/servicegraph_metrics:
        brokers:
          {{- range .Values.streamContract.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        metrics:
          topic: {{ .Values.streamContract.topics.servicegraphMetrics | quote }}
          encoding: otlp_json
        {{- if eq .Values.streamContract.kafka.security.protocol "SASL_SSL" }}
        tls:
          insecure: false
          insecure_skip_verify: false
        {{- end }}
        {{- if ne .Values.streamContract.kafka.security.protocol "PLAINTEXT" }}
        auth:
          sasl:
            username: ${env:KAFKA_SASL_USERNAME}
            password: ${env:KAFKA_SASL_PASSWORD}
            mechanism: {{ .Values.streamContract.kafka.security.saslMechanism }}
        {{- end }}
        producer:
          compression: gzip
          required_acks: -1
          allow_auto_topic_creation: false
        sending_queue:
          enabled: true
          sizer: items
          num_consumers: 4
          queue_size: 10000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch/traces]
          exporters: [service_graph]
        metrics/servicegraph:
          receivers: [service_graph]
          processors: [memory_limiter, cumulativetodelta/servicegraph, filter/servicegraph_output, batch/servicegraph_metrics]
          exporters: [kafka/servicegraph_metrics]
