apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "servicegraph-collector.fullname" . }}-router
  labels:
    {{- include "servicegraph-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: localhost:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch/traces:
        timeout: 1s
        send_batch_size: 256
      {{- if .Values.rootSpanDiscovery.enabled }}
      filter/root_span_discovery:
        error_mode: ignore
        trace_conditions:
          - context: span
            conditions:
              - >-
                not IsRootSpan() or
                attributes[{{ .Values.rootSpanDiscovery.markerAttribute | quote }}] != true
      batch/root_spans:
        timeout: 1s
        send_batch_size: 256
      {{- end }}
      {{- if .Values.entityEvents.enabled }}
      filter/entity_events:
        error_mode: ignore
        logs:
          log_record:
            - >-
              event_name != "entity.state" and
              event_name != "entity.delete" and
              attributes["otel.entity.event.type"] != "entity_state" and
              attributes["otel.entity.event.type"] != "entity.state" and
              attributes["otel.entity.event.type"] != "entity_delete" and
              attributes["otel.entity.event.type"] != "entity_deleted" and
              attributes["otel.entity.event.type"] != "entity.delete"
      batch/entity_events:
        timeout: 1s
        send_batch_size: 256
      {{- end }}
    exporters:
      {{- if eq .Values.backend.mode "singleWriter" }}
      otlp/servicegraph_backend:
        endpoint: {{ include "servicegraph-collector.fullname" . }}-backend-headless.{{ .Release.Namespace }}.svc:4317
        timeout: 5s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          sizer: items
          queue_size: {{ .Values.router.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- else }}
      load_balancing:
        routing_key: traceID
        protocol:
          otlp:
            timeout: 5s
            tls:
              insecure: true
            sending_queue:
              enabled: true
              sizer: items
              queue_size: 10000
            retry_on_failure:
              enabled: true
              initial_interval: 1s
              max_interval: 30s
              max_elapsed_time: 0s
        resolver:
          static:
            hostnames:
              {{- $root := . }}
              {{- range $ordinal := until (int .Values.backend.replicaCount) }}
              - {{ include "servicegraph-collector.fullname" $root }}-backend-{{ $ordinal }}.{{ include "servicegraph-collector.fullname" $root }}-backend-headless.{{ $root.Release.Namespace }}.svc:4317
              {{- end }}
        timeout: 10s
        sending_queue:
          enabled: true
          sizer: items
          queue_size: {{ .Values.router.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- end }}
      {{- if .Values.entityEvents.enabled }}
      kafka/entity_events:
        brokers:
          {{- range .Values.streamContract.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        logs:
          topic: {{ .Values.streamContract.topics.entityEvents | quote }}
          encoding: otlp_json
        {{- if eq .Values.streamContract.kafka.security.protocol "SASL_SSL" }}
        tls:
          insecure: false
          insecure_skip_verify: false
        {{- end }}
        {{- if ne .Values.streamContract.kafka.security.protocol "PLAINTEXT" }}
        auth:
          sasl:
            username: ${env:KAFKA_SASL_USERNAME}
            password: ${env:KAFKA_SASL_PASSWORD}
            mechanism: {{ .Values.streamContract.kafka.security.saslMechanism }}
        {{- end }}
        producer:
          compression: gzip
          required_acks: -1
          allow_auto_topic_creation: false
        sending_queue:
          enabled: true
          sizer: items
          num_consumers: 4
          queue_size: 10000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- end }}
      {{- if .Values.rootSpanDiscovery.enabled }}
      kafka/root_spans:
        brokers:
          {{- range .Values.streamContract.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        traces:
          topic: {{ .Values.streamContract.topics.rootSpans | quote }}
          encoding: otlp_json
        {{- if eq .Values.streamContract.kafka.security.protocol "SASL_SSL" }}
        tls:
          insecure: false
          insecure_skip_verify: false
        {{- end }}
        {{- if ne .Values.streamContract.kafka.security.protocol "PLAINTEXT" }}
        auth:
          sasl:
            username: ${env:KAFKA_SASL_USERNAME}
            password: ${env:KAFKA_SASL_PASSWORD}
            mechanism: {{ .Values.streamContract.kafka.security.saslMechanism }}
        {{- end }}
        producer:
          compression: gzip
          required_acks: -1
          allow_auto_topic_creation: false
        sending_queue:
          enabled: true
          sizer: items
          num_consumers: 4
          queue_size: 10000
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- end }}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch/traces]
          {{- if eq .Values.backend.mode "singleWriter" }}
          exporters: [otlp/servicegraph_backend]
          {{- else }}
          exporters: [load_balancing]
          {{- end }}
        {{- if .Values.entityEvents.enabled }}
        logs/entity_events:
          receivers: [otlp]
          processors: [memory_limiter, filter/entity_events, batch/entity_events]
          exporters: [kafka/entity_events]
        {{- end }}
        {{- if .Values.rootSpanDiscovery.enabled }}
        traces/root_span_discovery:
          receivers: [otlp]
          processors: [memory_limiter, filter/root_span_discovery, batch/root_spans]
          exporters: [kafka/root_spans]
        {{- end }}
