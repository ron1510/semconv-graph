{{- $discoveryModel := .Files.Get "files/root-span-discovery.yaml" | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "servicegraph-collector.fullname" . }}-router
  labels:
    {{- include "servicegraph-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: localhost:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch/traces:
        timeout: 1s
        send_batch_size: 256
      {{- if .Values.rootSpanDiscovery.enabled }}
      filter/root_span_discovery:
        error_mode: ignore
        trace_conditions:
          - context: span
            conditions:
              - not IsRootSpan()
              - span.kind == SPAN_KIND_CLIENT
              - span.kind == SPAN_KIND_SERVER
              {{- range $attribute := $discoveryModel.modeled_attributes }}
              - >-
                resource.attributes[{{ $attribute | quote }}] != nil and
                attributes[{{ $attribute | quote }}] != nil and
                resource.attributes[{{ $attribute | quote }}] != attributes[{{ $attribute | quote }}]
              {{- end }}
      batch/root_spans:
        timeout: 1s
        send_batch_size: 256
      {{- end }}
    exporters:
      {{- if .Values.rootSpanDiscovery.enabled }}
      load_balancing/root_span_discovery:
        routing_key: attributes
        routing_attributes:
          {{- range $attribute := $discoveryModel.routing_attributes }}
          - {{ $attribute | quote }}
          {{- end }}
        protocol:
          otlp:
            timeout: 5s
            tls:
              insecure: true
            sending_queue:
              enabled: true
              sizer: items
              queue_size: 10000
            retry_on_failure:
              enabled: true
              initial_interval: 1s
              max_interval: 30s
              max_elapsed_time: 0s
        resolver:
          static:
            hostnames:
              {{- $root := . }}
              {{- range $ordinal := until (int .Values.rootSpanDiscovery.backend.replicaCount) }}
              - {{ include "servicegraph-collector.fullname" $root }}-discovery-backend-{{ $ordinal }}.{{ include "servicegraph-collector.fullname" $root }}-discovery-backend-headless.{{ $root.Release.Namespace }}.svc:4317
              {{- end }}
        timeout: 10s
        sending_queue:
          enabled: true
          sizer: items
          queue_size: {{ .Values.router.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- end }}
      {{- if eq .Values.backend.mode "singleWriter" }}
      otlp/servicegraph_backend:
        endpoint: {{ include "servicegraph-collector.fullname" . }}-backend-headless.{{ .Release.Namespace }}.svc:4317
        timeout: 5s
        tls:
          insecure: true
        sending_queue:
          enabled: true
          sizer: items
          queue_size: {{ .Values.router.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- else }}
      load_balancing:
        routing_key: traceID
        protocol:
          otlp:
            timeout: 5s
            tls:
              insecure: true
            sending_queue:
              enabled: true
              sizer: items
              queue_size: 10000
            retry_on_failure:
              enabled: true
              initial_interval: 1s
              max_interval: 30s
              max_elapsed_time: 0s
        resolver:
          static:
            hostnames:
              {{- $root := . }}
              {{- range $ordinal := until (int .Values.backend.replicaCount) }}
              - {{ include "servicegraph-collector.fullname" $root }}-backend-{{ $ordinal }}.{{ include "servicegraph-collector.fullname" $root }}-backend-headless.{{ $root.Release.Namespace }}.svc:4317
              {{- end }}
        timeout: 10s
        sending_queue:
          enabled: true
          sizer: items
          queue_size: {{ .Values.router.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
      {{- end }}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch/traces]
          {{- if eq .Values.backend.mode "singleWriter" }}
          exporters: [otlp/servicegraph_backend]
          {{- else }}
          exporters: [load_balancing]
          {{- end }}
        {{- if .Values.rootSpanDiscovery.enabled }}
        traces/root_span_discovery:
          receivers: [otlp]
          processors: [memory_limiter, filter/root_span_discovery, batch/root_spans]
          exporters: [load_balancing/root_span_discovery]
        {{- end }}
