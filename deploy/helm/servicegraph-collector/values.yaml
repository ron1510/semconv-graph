nameOverride: ""
fullnameOverride: ""

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

router:
  # Both stateless routers use the same fixed backend hash ring.
  replicaCount: 2
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
  queueSize: 100000
  podAnnotations: {}

backend:
  # singleWriter minimizes repeated metric-series writes. Use horizontal only
  # when one backend cannot hold the required trace-pairing workload.
  mode: singleWriter
  replicaCount: 1
  serviceGraph:
    storeTtl: 10s
    storeMaxItems: 10000
    metricsFlushInterval: 30s
    metricBatchSize: 256
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1Gi
  podAnnotations: {}

streamContract:
  kafka:
    brokers:
      - kafka.example.internal:9093
    security:
      protocol: SASL_SSL
      saslMechanism: SCRAM-SHA-256
      existingSecret: servicegraph-kafka-auth
      usernameKey: username
      passwordKey: password
  topics:
    servicegraphMetrics: otel.servicegraph.metrics
    entityEvents: otel.entity.events
    rootSpans: otel.root.spans

entityEvents:
  enabled: false

rootSpanDiscovery:
  enabled: false
  markerAttribute: semconv.graph.discovery

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
