{{- if not (regexMatch "^[0-9a-fA-F]{32}$" .Values.job.fixedJobId) }}
{{- fail "job.fixedJobId must contain exactly 32 hexadecimal characters" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "servicegraph-flink.fullname" . }}-submitter
  labels:
    {{- include "servicegraph-flink.labels" . | nindent 4 }}
    app.kubernetes.io/component: submitter
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "servicegraph-flink.labels" . | nindent 8 }}
        app.kubernetes.io/component: submitter
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "servicegraph-flink.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
        {{- with .Values.podSecurityContext.fsGroup }}
        fsGroup: {{ . }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
        - name: submitter
          image: {{ .Values.image.ref | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              decision=0
              java -cp /opt/flink/usrlib/otel-servicegraph-diff.jar \
                io.extendedotel.flink.DeploymentCommands inspect || decision=$?

              if [ "${decision}" -eq 42 ]; then
                exit 0
              fi
              if [ "${decision}" -ne 0 ]; then
                exit "${decision}"
              fi

              restore_args=()
              if [ "${FLINK_IS_UPGRADE}" = "true" ]; then
                if [ ! -s "${FLINK_SAVEPOINT_HANDOFF}" ]; then
                  echo "Upgrade savepoint handoff ${FLINK_SAVEPOINT_HANDOFF} is missing" >&2
                  exit 44
                fi
                savepoint_path="$(cat "${FLINK_SAVEPOINT_HANDOFF}")"
                restore_args+=(--fromSavepoint "${savepoint_path}")
                {{- if .Values.job.allowNonRestoredState }}
                restore_args+=(--allowNonRestoredState)
                {{- end }}
                echo "Restoring Flink job ${FLINK_JOB_ID} from ${savepoint_path}"
              fi

              /opt/flink/bin/flink run --detached \
                -m "${FLINK_REST_ADDRESS}" \
                -D'$internal.pipeline.job-id'="${FLINK_JOB_ID}" \
                --parallelism {{ .Values.application.parallelism }} \
                -Dstate.backend.type={{ .Values.state.backend }} \
                {{- if eq .Values.state.backend "rocksdb" }}
                -Dstate.backend.rocksdb.localdir={{ .Values.state.rocksdb.localDirectory | quote }} \
                -Dstate.backend.rocksdb.timer-service.factory=ROCKSDB \
                -Dexecution.checkpointing.incremental={{ .Values.state.incrementalCheckpoints }} \
                {{- end }}
                -Dexecution.checkpointing.storage=filesystem \
                -Dexecution.checkpointing.dir=file:///flink-state/checkpoints \
                -Dexecution.checkpointing.savepoint-dir=file:///flink-state/savepoints \
                -Dexecution.checkpointing.externalized-checkpoint-retention=RETAIN_ON_CANCELLATION \
                -Dexecution.checkpointing.num-retained=2 \
                -Dexecution.checkpointing.max-concurrent-checkpoints=1 \
                -Dexecution.checkpointing.timeout={{ printf "%d ms" (.Values.job.checkpointTimeoutMs | int) | quote }} \
                -Dexecution.checkpointing.min-pause={{ printf "%d ms" (.Values.job.checkpointMinPauseMs | int) | quote }} \
                -Dexecution.checkpointing.tolerable-failed-checkpoints={{ .Values.job.tolerableFailedCheckpoints }} \
                "${restore_args[@]}" \
                --class io.extendedotel.flink.ServiceGraphJob \
                /opt/flink/usrlib/otel-servicegraph-diff.jar
              java -cp /opt/flink/usrlib/otel-servicegraph-diff.jar \
                io.extendedotel.flink.DeploymentCommands record-runtime
          env:
            - name: FLINK_REST_URL
              value: http://{{ include "servicegraph-flink.restServiceName" . }}:8081
            - name: FLINK_REST_ADDRESS
              value: {{ printf "%s:8081" (include "servicegraph-flink.restServiceName" .) | quote }}
            - name: FLINK_JOB_ID
              value: {{ .Values.job.fixedJobId | lower | quote }}
            - name: FLINK_IS_UPGRADE
              value: {{ .Release.IsUpgrade | quote }}
            - name: FLINK_SAVEPOINT_HANDOFF
              value: {{ printf "/flink-state/upgrades/revision-%d.savepoint" (.Release.Revision | int) | quote }}
            - name: ROOT_LOG_LEVEL
              value: {{ .Values.logging.rootLevel | upper | quote }}
            {{- include "servicegraph-flink.kafkaEnvironment" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.submitter | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: flink-state
              mountPath: /flink-state
            - name: flink-log
              mountPath: /opt/flink/log
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: flink-state
          persistentVolumeClaim:
            claimName: {{ include "servicegraph-flink.claimName" . }}
        - name: flink-log
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.emptyDir.tmpSizeLimit }}
