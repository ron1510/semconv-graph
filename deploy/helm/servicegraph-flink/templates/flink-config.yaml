apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "servicegraph-flink.fullname" . }}-config
  labels:
    {{- include "servicegraph-flink.labels" . | nindent 4 }}
data:
  config.yaml: |
    blob.server.port: 6124
    jobmanager.rpc.port: 6123
    taskmanager.rpc.port: 6122
    rest.port: 8081
    rest.bind-address: 0.0.0.0
    jobmanager.bind-host: 0.0.0.0
    taskmanager.bind-host: 0.0.0.0
    taskmanager.numberOfTaskSlots: {{ .Values.application.taskManagerSlots }}
    jobmanager.memory.process.size: {{ .Values.application.jobManagerProcessMemory }}
    taskmanager.memory.process.size: {{ .Values.application.taskManagerProcessMemory }}
    parallelism.default: {{ .Values.application.parallelism }}
    kubernetes.cluster-id: {{ .Values.application.clusterId }}
    kubernetes.namespace: {{ .Release.Namespace }}
    high-availability.type: kubernetes
    high-availability.storageDir: file:///flink-state/ha
    state.backend.type: {{ .Values.state.backend }}
    {{- if eq .Values.state.backend "rocksdb" }}
    state.backend.rocksdb.localdir: {{ .Values.state.rocksdb.localDirectory }}
    state.backend.rocksdb.timer-service.factory: ROCKSDB
    execution.checkpointing.incremental: {{ .Values.state.incrementalCheckpoints }}
    {{- end }}
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: file:///flink-state/checkpoints
    execution.checkpointing.savepoint-dir: file:///flink-state/savepoints
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.num-retained: 2
    execution.checkpointing.max-concurrent-checkpoints: 1
    execution.checkpointing.timeout: {{ .Values.job.checkpointTimeoutMs }} ms
    execution.checkpointing.min-pause: {{ .Values.job.checkpointMinPauseMs }} ms
    execution.checkpointing.tolerable-failed-checkpoints: {{ .Values.job.tolerableFailedCheckpoints }}
  log4j-console.properties: |
    rootLogger.level = {{ .Values.logging.rootLevel | upper }}
    rootLogger.appenderRef.console.ref = ConsoleAppender

    appender.console.name = ConsoleAppender
    appender.console.type = CONSOLE
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

    logger.pekko.name = org.apache.pekko
    logger.pekko.level = INFO
    logger.kafka.name = org.apache.kafka
    logger.kafka.level = INFO
