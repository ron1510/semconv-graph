image:
  ref: registry.internal.example/extended-otel-flink-runtime:2.2.1-java11
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

application:
  clusterId: servicegraph-diff
  parallelism: 3
  jobManagerReplicas: 1
  taskManagerReplicas: 2
  taskManagerSlots: 2
  jobManagerProcessMemory: 1200m
  taskManagerProcessMemory: 1800m

streamContract:
  kafka:
    brokers:
      - kafka.internal.example:9092
    security:
      protocol: SASL_SSL
      saslMechanism: SCRAM-SHA-256
      existingSecret: servicegraph-kafka-auth
      usernameKey: username
      passwordKey: password
  topics:
    servicegraphMetrics: otel.servicegraph.metrics
    entityEvents: otel.entity.events
    interactionEvents: graph.elements.events

entityEvents:
  enabled: false
  groupId: graph-element-engine-entities
  reportIntervalGraceSeconds: 30

job:
  fixedJobId: "00000000000000000000000000000001"
  allowNonRestoredState: false
  groupId: graph-element-engine
  interactionTtlSeconds: 300
  allowedLatenessSeconds: 60
  stateTtlSeconds: 86400
  checkpointIntervalMs: 30000
  restartAttempts: 3
  restartDelaySeconds: 10

logging:
  rootLevel: INFO

storage:
  createClaim: true
  existingClaim: ""
  storageClassName: rwx
  size: 10Gi
  accessModes:
    - ReadWriteMany
  retainClaim: true

nodeSelector: {}
tolerations: []

podSecurityContext:
  runAsUser: null
  runAsGroup: null
  fsGroup: null

resources:
  submitter:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  jobManager:
    requests:
      cpu: 500m
      memory: 1280Mi
    limits:
      memory: 1536Mi
  taskManager:
    requests:
      cpu: "1"
      memory: 1920Mi
    limits:
      memory: 2304Mi

emptyDir:
  logSizeLimit: 256Mi
  tmpSizeLimit: 256Mi
