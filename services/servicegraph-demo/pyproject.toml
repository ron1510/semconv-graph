[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-otel-servicegraph-demo"
version = "0.1.1"
license = "Apache-2.0"
description = "Live synthetic OTLP traffic for the service-graph demo."
requires-python = ">=3.12,<3.13"
dependencies = [
  "opentelemetry-proto==1.44.0",
]

[project.scripts]
servicegraph-demo = "servicegraph_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]
