[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otel-servicegraph-diff"
version = "0.2.0"
license = "Apache-2.0"
description = "PyFlink servicegraph graph-element lifecycle application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "apache-flink==2.2.1",
  "extended-opentelemetry-semconv>=0.4.0,<0.5.0",
  "opentelemetry-proto==1.44.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
]

[project.scripts]
otel-servicegraph-diff = "otel_servicegraph_diff.flink_job:main"

[tool.setuptools.packages.find]
where = ["src"]
