[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicegraph-indexer"
version = "0.1.0"
license = "Apache-2.0"
description = "ArangoDB current-state indexer for service graph elements."
requires-python = ">=3.12,<3.13"
dependencies = [
  "kafka-python-ng==2.2.3",
  "opentelemetry-api==1.44.0",
  "pydantic-settings==2.15.0",
  "python-arango==8.3.3",
]

[project.scripts]
servicegraph-indexer-init = "servicegraph_indexer.initialize:main"
servicegraph-indexer = "servicegraph_indexer.indexer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servicegraph_indexer = ["metadata/*.json"]
