[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-opentelemetry-semconv-workspace"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "datamodel-code-generator==0.71.0",
  "hypothesis==6.158.0",
  "httpx==0.28.1",
  "gremlinpython==3.8.1",
  "kafka-python-ng==2.2.3",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "PyYAML==6.0.3",
  "ruff==0.15.22",
]
docs = [
  "mkdocs-material==9.7.7",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
  "e2e: provisions a disposable Kubernetes environment and exercises the complete runtime",
  "arangodb: starts disposable ArangoDB and Gremlin containers",
]
pythonpath = [
  ".",
  "packages/extended-opentelemetry-semconv/src",
  "services/otel-servicegraph-diff/src",
  "services/servicegraph-demo/src",
  "services/servicegraph-indexer/src",
]
testpaths = [
  "packages/extended-opentelemetry-semconv/tests",
  "examples/auto-instrumentation",
  "services/otel-servicegraph-diff/tests",
  "services/servicegraph-demo/tests",
  "services/servicegraph-indexer/tests",
  "tools/semconv_codegen/tests",
  "tests/benchmarks",
  "tests/local_demo",
  "tests/e2e",
]

[tool.coverage.run]
branch = true
omit = [
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/generated/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [
  ".pr-work",
  ".tmp",
  "packages/extended-opentelemetry-semconv/src/extended_otel_semconv/generated",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF043"]

[tool.ruff.lint.isort]
known-first-party = [
  "extended_otel_semconv",
  "otel_servicegraph_diff",
  "servicegraph_demo",
  "servicegraph_indexer",
  "tools",
]

[tool.pyright]
include = [
  "packages/extended-opentelemetry-semconv/src",
  "packages/extended-opentelemetry-semconv/tests",
  "examples/auto-instrumentation",
  "services/otel-servicegraph-diff/src",
  "services/otel-servicegraph-diff/tests",
  "services/servicegraph-demo/src",
  "services/servicegraph-demo/tests",
  "services/servicegraph-indexer/src",
  "services/servicegraph-indexer/tests",
  "tools/semconv_codegen",
  "tools/local_demo",
  "benchmarks",
  "tests/benchmarks",
  "tests/local_demo",
  "conftest.py",
  "tests/e2e",
]
extraPaths = [
  ".",
  "packages/extended-opentelemetry-semconv/src",
  "services/otel-servicegraph-diff/src",
  "services/servicegraph-demo/src",
  "services/servicegraph-indexer/src",
]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
